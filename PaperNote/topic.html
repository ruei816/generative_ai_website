<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PaperNote 研究主題與論文瀏覽頁">
  <title>研究主題｜PaperNote</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20261110-topic-pages">
  <script src="assets/js/topics.js"></script>
  <script src="assets/js/papers.js"></script>
  <script src="assets/js/topic.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="site-header title-block">
      <a class="brand" href="index.html" aria-label="PaperNote 首頁">✦ PAPERNOTE</a>
      <span class="header-caption">RESEARCH TOPIC ARCHIVE</span>
    </header>
    <main>
      <section class="topic-hero title-block">
        <p class="eyebrow">PAPERNOTE / TOPIC COLLECTION</p>
        <span id="topic-hero-icon" class="topic-hero-icon" aria-hidden="true">✦</span>
        <h1 id="topic-title">研究主題</h1>
        <p id="topic-english" class="topic-english">RESEARCH TOPIC</p>
        <p id="topic-description" class="topic-hero-description"></p>
        <div id="topic-keywords" class="keyword-list topic-hero-keywords"></div>
      </section>
      <section class="topic-papers-section">
        <div class="section-heading">
          <div><p class="eyebrow">01 / PAPERS IN THIS TOPIC</p><h2>主題論文 ✦</h2></div>
          <span id="topic-paper-count" class="section-note">0 PAPERS</span>
        </div>
        <div id="topic-paper-grid" class="paper-grid topic-paper-grid"></div>
        <div id="topic-empty" class="card empty-state">
          <div class="empty-icon" aria-hidden="true">▤</div>
          <h3>這個主題目前還沒有論文</h3>
          <p>新增論文時，請在論文索引資料中加入對應的主題 ID；符合此主題的論文就會自動顯示在這裡。</p>
          <span class="empty-stamp">TOPIC ARCHIVE · 0 PAPERS</span>
        </div>
      </section>
    </main>
    <footer class="site-footer"><a href="index.html">← 返回論文首頁</a><span>PaperNote © 2026</span></footer>
  </div>
  <button class="back-to-top" id="back-to-top" type="button" aria-label="回到頁面頂部" title="回到頁面頂部">↑</button>
</body>
</html>
